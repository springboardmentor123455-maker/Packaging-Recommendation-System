<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eco Packaging AI System</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="bg-layer"></div>

<div class="app">

<header class="header">
    <h1>🌱 Eco-Friendly Packaging AI</h1>
    <p>Smart, sustainable material recommendations</p>
</header>

<section class="panel">
    <h2>Product Configuration</h2>

    <div class="grid">
        <select id="category">
            <option>Food</option>
            <option>Electronics</option>
            <option>Cosmetics</option>
            <option>Furniture</option>
        </select>

        <select id="weight">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
        </select>

        <select id="fragility">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
        </select>

        <select id="budget">
            <option>Low Cost</option>
            <option selected>Balanced</option>
            <option>Premium</option>
        </select>

        <select id="priority">
            <option selected>Eco Priority</option>
            <option>Balanced</option>
            <option>Performance Priority</option>
        </select>

        <select id="limit">
            <option value="3">Top 3</option>
            <option value="5">Top 5</option>
            <option value="10" selected>Top 10</option>
            <option value="15">Top 15</option>
        </select>
    </div>

    <div class="actions">
        <button onclick="getResults()">Generate</button>
        <a href="/dashboard"><button class="secondary">BI Dashboard</button></a>
    </div>
</section>

<div id="loader" class="loader hidden"></div>
<section id="results" class="results"></section>

</div>

<script src="/static/script.js"></script>
</body>
</html>
