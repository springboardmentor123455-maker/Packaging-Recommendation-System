<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eco Packaging AI System</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="bg-layer"></div>

<div class="app">

<header class="header">
    <h1>🌱 Eco-Friendly Packaging AI</h1>
    <p>Smart, sustainable material recommendations</p>
</header>

<section class="panel">
    <h2>📦 Product Configuration</h2>

    <div class="grid">

        <!-- PRODUCT CATEGORY -->
        <div>
            <label><strong>Product Category</strong></label>
            <select id="category">
                <option>Food</option>
                <option>Electronics</option>
                <option>Cosmetics</option>
                <option>Furniture</option>
            </select>
            <small>Select the industry type</small>
        </div>

        <!-- PRODUCT WEIGHT -->
        <div>
            <label><strong>Product Weight</strong></label>
            <select id="weight">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
            </select>
            <small>Controls material strength</small>
        </div>

        <!-- PRODUCT FRAGILITY -->
        <div>
            <label><strong>Product Fragility</strong></label>
            <select id="fragility">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
            </select>
            <small>Higher fragility → safer materials</small>
        </div>

        <!-- BUDGET -->
        <div>
            <label><strong>Budget Preference</strong></label>
            <select id="budget">
                <option>Low Cost</option>
                <option selected>Balanced</option>
                <option>Premium</option>
            </select>
            <small>Cost sensitivity</small>
        </div>

        <!-- OPTIMIZATION PRIORITY -->
        <div>
            <label><strong>Optimization Priority</strong></label>
            <select id="priority">
                <option selected>Eco Priority</option>
                <option>Balanced</option>
                <option>Performance Priority</option>
            </select>
            <small>Eco vs durability focus</small>
        </div>

        <!-- TOP N -->
        <div>
            <label><strong>Recommendation Limit</strong></label>
            <select id="limit">
                <option value="3">Top 3</option>
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="15">Top 15</option>
            </select>
            <small>Number of materials shown</small>
        </div>

    </div>

    <div class="actions">
        <button onclick="getResults()">⚡ Generate Recommendations</button>
        <a href="/dashboard">
            <button class="secondary">📊 BI Dashboard</button>
        </a>
    </div>
</section>

<div id="loader" class="loader hidden"></div>
<section id="results" class="results"></section>

</div>

<script src="/static/script.js"></script>
</body>
</html>
