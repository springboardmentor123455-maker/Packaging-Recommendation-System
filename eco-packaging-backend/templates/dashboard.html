<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BI Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

    <h1>📊 Business Intelligence Dashboard</h1>

    <!-- 🔙 BACK TO MAIN PAGE BUTTON -->
    <div style="margin-bottom: 25px;">
        <a href="/">
            <button class="secondary">⬅ Back to Recommendation Page</button>
        </a>
    </div>

    <!-- ================= KPI CARDS ================= -->
    <div class="results">
        <div class="card">
            <h3>CO₂ Reduction</h3>
            <h2>{{ co2_reduction }}%</h2>
        </div>

        <div class="card">
            <h3>Cost Savings</h3>
            <h2>₹ {{ cost_savings }}</h2>
        </div>
    </div>

    <!-- ================= BAR CHART ================= -->
    <h2 style="margin-top:40px;">📊 Material Usage (Bar Chart)</h2>
    <img src="/static/bar_chart.png" width="80%" style="display:block;margin:auto;">

    <!-- ================= PIE CHART ================= -->
    <h2 style="margin-top:40px;">🥧 Category Distribution (Pie Chart)</h2>
    <img src="/static/pie_chart.png" width="60%" style="display:block;margin:auto;">

    <!-- ================= EXPORT BUTTONS ================= -->
    <div style="margin-top:40px;">
        <a href="/download/excel">
            <button>⬇ Export Excel</button>
        </a>

        <a href="/download/pdf">
            <button class="secondary">⬇ Export PDF</button>
        </a>
    </div>

</div>

</body>
</html>
