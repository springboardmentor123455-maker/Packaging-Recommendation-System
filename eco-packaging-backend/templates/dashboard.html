<!DOCTYPE html>
<html>
<head>
    <title>Business Intelligence Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-4">📊 Business Intelligence Dashboard</h2>

    <div class="row text-center">
        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>CO₂ Reduction</h5>
                <h2>{{ co2_reduction }}%</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Cost Savings</h5>
                <h2>₹ {{ cost_savings }}</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow">
                <h5>Top Material</h5>
                <h2>{{ top_material }}</h2>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <img src="/static/charts/material_usage.png" class="img-fluid mb-3">
        <img src="/static/charts/co2_pie.png" class="img-fluid">
    </div>

    <div class="text-center mt-4">
        <a href="/download-excel" class="btn btn-success me-2">⬇ Excel</a>
        <a href="/download-pdf" class="btn btn-danger">⬇ PDF</a>
    </div>
</div>

</body>
</html>
