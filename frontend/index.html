<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Material Recommendation</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">EcoPackAI – Packaging Material Recommendation</h2>

    <!-- Input Form -->
    <div class="card p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Product Weight (kg)</label>
                <input type="number" id="productWeight" class="form-control" placeholder="e.g. 2.5">
            </div>
            <div class="col-md-6">
                <label class="form-label">Required Strength (MPa)</label>
                <input type="number" id="strengthRequired" class="form-control" placeholder="e.g. 50">
            </div>
        </div>

        <button class="btn btn-success mt-3" onclick="getRecommendations()">
            Get Recommendations
        </button>
    </div>

    <!-- Results -->
    <div class="card p-4">
        <h5>Recommended Materials</h5>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Cost / Kg</th>
                    <th>CO₂ Score</th>
                    <th>Strength</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="resultsTable"></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
